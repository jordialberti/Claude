<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WD1 — Sol·licituds de Compra → Comandes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1>WD1</h1>
            <span class="header-subtitle">SAP Business One — Conversió de Sol·licituds de Compra</span>
        </div>
        <div class="header-right">
            <span class="env-badge">Simulació</span>
        </div>
    </header>

    <main class="main">
        <!-- Filters -->
        <section class="filters">
            <div class="filter-group">
                <label for="filter-status">Estat</label>
                <select id="filter-status">
                    <option value="all">Tots</option>
                    <option value="pending" selected>Pendents</option>
                    <option value="partial">Parcials</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-date-from">Des de</label>
                <input type="date" id="filter-date-from">
            </div>
            <div class="filter-group">
                <label for="filter-date-to">Fins a</label>
                <input type="date" id="filter-date-to">
            </div>
            <div class="filter-group">
                <label for="filter-supplier">Proveïdor</label>
                <select id="filter-supplier">
                    <option value="all">Tots</option>
                </select>
            </div>
            <button id="btn-filter" class="btn btn-secondary">Filtrar</button>
        </section>

        <!-- Action bar -->
        <section class="action-bar">
            <div class="selection-info">
                <input type="checkbox" id="select-all" title="Seleccionar tot">
                <span id="selection-count">0 sol·licituds seleccionades</span>
            </div>
            <button id="btn-convert" class="btn btn-primary" disabled>
                Convertir en Comandes de Compra
            </button>
        </section>

        <!-- Purchase requests table -->
        <section class="table-container">
            <table id="pr-table">
                <thead>
                    <tr>
                        <th class="col-check"></th>
                        <th class="col-doc">Nº Doc.</th>
                        <th class="col-date">Data</th>
                        <th class="col-supplier">Proveïdor</th>
                        <th class="col-lines">Línies</th>
                        <th class="col-total">Total (€)</th>
                        <th class="col-status">Estat</th>
                    </tr>
                </thead>
                <tbody id="pr-tbody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
            <div id="empty-state" class="empty-state hidden">
                No s'han trobat sol·licituds de compra amb els filtres seleccionats.
            </div>
        </section>

        <!-- Conversion result modal -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h2>Resultat de la Conversió</h2>
                    <button id="modal-close" class="modal-close">&times;</button>
                </div>
                <div id="modal-body" class="modal-body">
                    <!-- Populated by JS -->
                </div>
                <div class="modal-footer">
                    <button id="modal-ok" class="btn btn-primary">D'acord</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span>WD1 v0.1 — Plantilla de validació (dades simulades)</span>
    </footer>

    <script src="js/mock-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
