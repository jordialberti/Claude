name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frame
        run: |
          cd Frame
          npm ci
          npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p _site/WD1 _site/helloworld _site/Frame
          cp index.html _site/
          cp -r WD1/* _site/WD1/
          cp -r helloworld/* _site/helloworld/
          cp -r Frame/dist/* _site/Frame/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
