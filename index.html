<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude — Projectes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #f5f6fa; color: #32363a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }

        .card h2 { font-size: 18px; color: #0a6ed1; margin-bottom: 4px; }
        .card .desc { font-size: 14px; color: #6a6d70; }
        .card .lang { font-size: 11px; font-weight: 600; text-transform: uppercase; background: #e8f4fd; color: #0a6ed1; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
    </style>
</head>
